name: Build v67suite

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Download ImGui
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/ocornut/imgui/archive/refs/tags/v1.90.4.zip" -OutFile "imgui.zip"
          Expand-Archive -Path "imgui.zip" -DestinationPath "."
          Rename-Item "imgui-1.90.4" "imgui"

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: v67suite-exe
          path: build/Release/v67suite.exe
