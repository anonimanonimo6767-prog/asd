name: Build v67suite

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download ImGui
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/ocornut/imgui/archive/refs/tags/v1.90.4.zip" -OutFile "imgui.zip"
          Expand-Archive -Path "imgui.zip" -DestinationPath "."
          Rename-Item "imgui-1.90.4" "imgui"

      - name: Build with MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile
        shell: cmd
        run: |
          mkdir output
          cl.exe /EHsc /std:c++17 /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN /I. /Iimgui /Iimgui/backends cheat.cpp imgui/imgui.cpp imgui/imgui_draw.cpp imgui/imgui_tables.cpp imgui/imgui_widgets.cpp imgui/backends/imgui_impl_dx11.cpp imgui/backends/imgui_impl_win32.cpp /Fe:output/v67suite.exe /link d3d11.lib dxgi.lib d3dcompiler.lib user32.lib gdi32.lib winhttp.lib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: v67suite-exe
          path: output/v67suite.exe