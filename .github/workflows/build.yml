name: Build v67suite

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download ImGui
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/ocornut/imgui/archive/refs/tags/v1.90.4.zip" -OutFile "imgui.zip"
          Expand-Archive -Path "imgui.zip" -DestinationPath "."
          Rename-Item "imgui-1.90.4" "imgui"

      - name: Configure and Build
        shell: pwsh
        run: |
          $vsPath = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $vcvars = "$vsPath\VC\Auxiliary\Build\vcvars64.bat"
          cmd /c "call `"$vcvars`" ^&^& cmake -B build -G `"Visual Studio 17 2022`" -A x64 ^&^& cmake --build build --config Release"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: v67suite-exe
          path: build/Release/v67suite.exe
